services:
  workload:
    build: {context: ., target: workload}
    environment:
      SENTINEL_WORKLOAD_MODE: local
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
    volumes: ["workload-log:/var/log"]
    ports: ["127.0.0.1:9464:9464"]
    networks: [observe]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9464/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      alloy: {condition: service_started}
  workload-payments:
    build: {context: ., target: workload}
    environment:
      SENTINEL_WORKLOAD_MODE: local
      OTEL_SERVICE_NAME: payments
      WORKLOAD_LOG_FILE: /var/log/payments.log
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
    volumes: ["workload-log:/var/log"]
    ports: ["127.0.0.1:9465:9464"]
    networks: [observe]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9464/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      alloy: {condition: service_started}
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./ops/prometheus-rules.yml:/etc/prometheus/rules.yml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [observe]
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/config/blackbox.yml"]
    volumes: ["./ops/blackbox.yml:/config/blackbox.yml:ro"]
    networks: [observe]
  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["./ops/loki.yaml:/etc/loki/local-config.yaml:ro", "loki-data:/loki"]
    ports: ["127.0.0.1:3100:3100"]
    networks: [observe]
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./ops/tempo.yaml:/etc/tempo.yaml:ro", "tempo-data:/var/tempo"]
    ports: ["127.0.0.1:3200:3200"]
    networks: [observe]
  alloy:
    image: grafana/alloy:v1.11.2
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=0.0.0.0:12345"]
    ports: ["127.0.0.1:12345:12345"]
    volumes: ["./ops/alloy.alloy:/etc/alloy/config.alloy:ro", "workload-log:/var/log:ro", "alloy-data:/var/lib/alloy/data"]
    networks: [observe]
  grafana:
    image: grafana/grafana-oss:13.0.2
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD}
      SENTINEL_GRAFANA_ENDPOINT_ID: ${SENTINEL_GRAFANA_ENDPOINT_ID:-unconfigured}
      SENTINEL_WEBHOOK_SECRET: ${SENTINEL_WEBHOOK_SECRET:-unconfigured}
      SENTINEL_GRAFANA_WEBHOOK_BASE_URL: ${SENTINEL_GRAFANA_WEBHOOK_BASE_URL:-http://host.docker.internal:3010}
    volumes:
      - "./ops/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./ops/grafana/dashboards:/etc/grafana/sentinel-dashboards:ro"
      - "grafana-data:/var/lib/grafana"
    ports: ["127.0.0.1:3012:3000"]
    networks: [observe]
  ntfy:
    image: binwiederhier/ntfy:v2.14.0
    command: ["serve"]
    environment:
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ENABLE_SIGNUP: "false"
    volumes: ["ntfy-data:/var/lib/ntfy"]
    ports: ["127.0.0.1:8091:80"]
    networks: [observe]
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_OPERATOR_PASSWORD:?Set KEYCLOAK_OPERATOR_PASSWORD}
      KC_HOSTNAME: http://localhost:8088
    volumes: ["./.local/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro", "keycloak-data:/opt/keycloak/data"]
    ports: ["127.0.0.1:8088:8080"]
    networks: [observe]
networks:
  observe:
    name: sentinel-observe
volumes:
  workload-log:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
  keycloak-data:
  ntfy-data:
