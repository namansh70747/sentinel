# Use with compose.durable.yml and compose.observe.yml, in that order.
services:
  worker-communication:
    build: {context: ., target: worker-communication}
    networks: [default, observe]
    environment:
      DATABASE_URL: postgres://sentinel_app:${SENTINEL_DATABASE_PASSWORD}@postgres:5432/sentinel
      SENTINEL_CONNECTOR_KEY_FILE: /run/secrets/connector_key
    secrets: [connector_key]
    restart: on-failure
    stop_grace_period: 40s
    depends_on:
      migrate: {condition: service_completed_successfully}
  grafana:
    environment:
      SENTINEL_GRAFANA_WEBHOOK_BASE_URL: http://console:3010
  console:
    networks: [default, observe]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      SENTINEL_EGRESS_ALLOWLIST: prometheus,loki,tempo,ntfy
      SENTINEL_CONNECTOR_KEY_FILE: /run/secrets/connector_key
      SENTINEL_ALLOW_LOCAL_OIDC_HTTP: "true"
      SENTINEL_LOCAL_OIDC_INTERNAL_URL: http://keycloak:8080
    secrets: [connector_key]
  worker-read:
    networks: [default, observe]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      NTFY_URL: http://ntfy:80
      NTFY_TOPIC: ${NTFY_TOPIC:-sentinel-local-alerts}
      SENTINEL_ECS_MODE: off
      SENTINEL_ADVISORY_METRICS: 'true'
      SENTINEL_EGRESS_ALLOWLIST: prometheus,loki,tempo,ntfy
      SENTINEL_CONNECTOR_KEY_FILE: /run/secrets/connector_key
    secrets: [connector_key]
secrets:
  connector_key:
    file: ./.local/connector-key
