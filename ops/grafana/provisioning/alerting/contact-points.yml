apiVersion: 1
contactPoints:
  - orgId: 1
    name: sentinel
    receivers:
      - uid: sentinel
        type: webhook
        settings:
          url: ${SENTINEL_GRAFANA_WEBHOOK_BASE_URL}/api/webhooks/grafana/${SENTINEL_GRAFANA_ENDPOINT_ID}
          httpMethod: POST
          headers:
            x-sentinel-secret: ${SENTINEL_WEBHOOK_SECRET}
        disableResolveMessage: false
