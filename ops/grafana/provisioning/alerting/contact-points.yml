apiVersion: 1
contactPoints:
  - orgId: 1
    name: sentinel
    receivers:
      - uid: sentinel
        type: webhook
        settings:
          url: http://host.docker.internal:3023/api/webhooks/grafana/${SENTINEL_GRAFANA_ENDPOINT_ID}
          httpMethod: POST
          headers:
            x-sentinel-secret: ${SENTINEL_WEBHOOK_SECRET}
        disableResolveMessage: false
