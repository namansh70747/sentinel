apiVersion: 1
groups:
  - orgId: 1
    name: sentinel-workload
    folder: Sentinel local
    interval: 10s
    rules:
      - uid: sentinel-workload-failures
        title: Checkout request failures
        condition: C
        for: 20s
        noDataState: NoData
        execErrState: Error
        notification_settings:
          receiver: sentinel
          group_by: [grafana_folder, alertname, service]
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 4h
        annotations:
          summary: Checkout requests exceed the local failure threshold
        labels:
          service: checkout-api
          sli: availability
          source: sentinel-local
        data:
          - refId: A
            datasourceUid: sentinel-prometheus
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: sentinel-prometheus}
              editorMode: code
              expr: sum(rate(workload_requests_total{job="workload"}[1m]) - rate(workload_requests_good{job="workload"}[1m])) / clamp_min(sum(rate(workload_requests_total{job="workload"}[1m])), 0.000001)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              datasource: {type: __expr__, uid: __expr__}
              type: math
              expression: $A > 0.2
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: sentinel-payments-failures
        title: Payments request failures
        condition: C
        for: 20s
        noDataState: NoData
        execErrState: Error
        notification_settings:
          receiver: sentinel-payments
          group_by: [grafana_folder, alertname, service]
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 4h
        annotations:
          summary: Payments requests exceed the local failure threshold
        labels:
          service: payments-api
          sli: availability
          source: sentinel-local
        data:
          - refId: A
            datasourceUid: sentinel-prometheus
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: sentinel-prometheus}
              editorMode: code
              expr: sum(rate(workload_requests_total{job="workload-payments"}[1m]) - rate(workload_requests_good{job="workload-payments"}[1m])) / clamp_min(sum(rate(workload_requests_total{job="workload-payments"}[1m])), 0.000001)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              datasource: {type: __expr__, uid: __expr__}
              type: math
              expression: $A > 0.2
              intervalMs: 1000
              maxDataPoints: 43200
